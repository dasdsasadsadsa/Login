<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Login</title>
  <style>
    :root {
      --bg: #ececec;
      --panel: rgba(245, 245, 245, 0.82);
      --text: #151515;
      --muted: #6f6f73;
      --border: rgba(45, 45, 50, 0.72);
      --blue: #2f6fe4;
      --red: #ff5f57;
      --green: #a6f28e;
      --green-deep: #61d96f;
      --switch-off: rgba(255, 95, 87, 0.82);
      --switch-on: rgba(121, 238, 117, 0.88);
      --shadow: 0 26px 70px rgba(0, 0, 0, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.96), transparent 34%),
        radial-gradient(circle at 85% 78%, rgba(206, 206, 206, 0.72), transparent 40%),
        linear-gradient(145deg, #f6f6f6, #d8d8d8);
      font-family:
        "SF Pro Rounded",
        "Arial Rounded MT Bold",
        "Avenir Next",
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
      font-weight: 300;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      position: relative;
      width: min(92vw, 430px);
      min-height: 600px;
      display: grid;
      place-items: center;
    }

    .ambient {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      filter: blur(12px);
      pointer-events: none;
    }

    .switch-stage {
      position: absolute;
      z-index: 5;
      display: grid;
      justify-items: center;
      gap: 16px;
      transition:
        transform 680ms cubic-bezier(.22, 1, .36, 1),
        opacity 520ms ease,
        filter 520ms ease;
    }

    .switch-stage.move-up {
      transform: translateY(-205px) scale(0.78);
    }

    .switch-stage.fade-away {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    .switch-stage.startup-gone {
      opacity: 0;
      transform: translateY(-10px) scale(0.88);
      filter: blur(10px);
      pointer-events: none;
    }

    .power-switch {
      width: 112px;
      height: 60px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 999px;
      background: rgba(92, 92, 96, 0.45);
      box-shadow:
        inset 0 0 0 1px rgba(36, 36, 40, 0.15),
        inset 0 8px 18px rgba(255, 255, 255, 0.1),
        0 18px 34px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition:
        background 620ms cubic-bezier(.22, 1, .36, 1),
        box-shadow 620ms ease;
    }

    .switch-knob {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(221, 221, 224, 0.9));
      box-shadow:
        0 8px 14px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: translateX(54px);
      transition:
        transform 720ms cubic-bezier(.18, .88, .24, 1.18),
        background 450ms ease;
    }

    .power-switch.is-off {
      background: var(--switch-off);
    }

    .power-switch.is-off .switch-knob {
      transform: translateX(0);
    }

    .power-switch.is-on {
      background: var(--switch-on);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.34),
        inset 0 8px 18px rgba(255, 255, 255, 0.14),
        0 18px 34px rgba(86, 218, 95, 0.23);
    }

    .power-switch.is-on .switch-knob {
      transform: translateX(54px);
    }

    .switch-state {
      min-height: 22px;
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.18em;
      color: rgba(35, 35, 38, 0.66);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .switch-state.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .login-panel,
    .success-panel {
      width: 100%;
      padding: 42px 30px 32px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .login-panel {
      opacity: 0;
      transform: translateY(28px) scale(0.975);
      pointer-events: none;
      transition:
        opacity 620ms ease,
        transform 720ms cubic-bezier(.22, 1, .36, 1),
        filter 420ms ease;
    }

    .login-panel.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .login-panel.leaving {
      opacity: 0;
      transform: translateY(18px) scale(0.965);
      filter: blur(6px);
      pointer-events: none;
    }

    .login-title {
      position: relative;
      margin: 0 0 34px;
      text-align: center;
      color: #f4f1ea;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 300;
      -webkit-text-stroke: 0.45px rgba(74, 70, 64, 0.45);
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 2px 0 rgba(224, 220, 211, 0.9),
        0 5px 9px rgba(71, 67, 61, 0.18),
        0 15px 28px rgba(36, 34, 31, 0.10);
      filter: saturate(0.72);
    }

    .login-title::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 54%;
      width: 118px;
      height: 17px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      filter: blur(8px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 19px;
    }

    .field label {
      padding-left: 5px;
      color: #3f3f43;
      font-size: 13px;
      letter-spacing: 0.01em;
      font-weight: 400;
    }

    .field input {
      width: 100%;
      height: 54px;
      padding: 0 17px;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      color: #18181a;
      background: rgba(255, 255, 255, 0.58);
      font-size: 16px;
      font-weight: 300;
      transition:
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .field input::placeholder {
      color: rgba(70, 70, 74, 0.55);
    }

    .field input:focus {
      border-color: rgba(38, 38, 42, 0.95);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 0 0 4px rgba(20, 20, 24, 0.07);
      transform: translateY(-1px);
    }

    .support-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -5px;
      margin-bottom: 23px;
    }

    .support-link {
      position: relative;
      border: 0;
      padding: 0;
      color: var(--blue);
      background: transparent;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
    }

    .support-link::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: currentColor;
      opacity: 0.16;
      transform: scaleX(0.88);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .support-link:hover::after,
    .support-link:focus-visible::after {
      opacity: 0.75;
      transform: scaleX(1);
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(30, 30, 32, 0.88);
      border-radius: 16px;
      color: #f8f8f8;
      background: #232326;
      box-shadow: 0 11px 24px rgba(0, 0, 0, 0.16);
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        background 160ms ease;
    }

    .login-button:hover {
      transform: translateY(-2px);
      background: #151517;
      box-shadow: 0 15px 28px rgba(0, 0, 0, 0.18);
    }

    .login-button:active {
      transform: translateY(0) scale(0.985);
    }

    .error-message {
      height: 18px;
      margin: 12px 0 0;
      text-align: center;
      color: #dc4a45;
      font-size: 12px;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .error-message.visible {
      opacity: 1;
    }

    .shake {
      animation: shake 430ms ease;
    }

    .success-panel {
      position: absolute;
      opacity: 0;
      transform: translateY(22px) scale(0.96);
      pointer-events: none;
      text-align: center;
      background: rgba(213, 213, 216, 0.82);
      transition:
        opacity 650ms ease,
        transform 760ms cubic-bezier(.22, 1, .36, 1);
    }

    .success-panel.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .success-dot {
      width: 12px;
      height: 12px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--green-deep);
      box-shadow: 0 0 0 8px rgba(97, 217, 111, 0.12);
    }

    .success-panel h2 {
      margin: 0;
      color: #76db72;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 300;
      letter-spacing: -0.035em;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    @media (max-width: 480px) {
      .app {
        min-height: 100svh;
        width: min(91vw, 390px);
      }

      .switch-stage.move-up {
        transform: translateY(-220px) scale(0.74);
      }

      .login-panel,
      .success-panel {
        padding-inline: 23px;
        border-radius: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <div class="ambient" aria-hidden="true"></div>

    <section class="switch-stage" id="switchStage" aria-label="전원 상태">
      <div class="power-switch" id="powerSwitch" aria-hidden="true">
        <div class="switch-knob"></div>
      </div>
      <p class="switch-state" id="switchState">OFF</p>
    </section>

    <form class="login-panel" id="loginPanel" novalidate>
      <h1 class="login-title">Login</h1>

      <div class="field">
        <label for="userId">아이디</label>
        <input
          id="userId"
          name="userId"
          type="text"
          placeholder="ID"
          autocomplete="username"
          aria-label="아이디"
        />
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="PW"
          autocomplete="current-password"
          aria-label="비밀번호"
        />
      </div>

      <div class="support-row">
        <button class="support-link" type="button">고객센터에 문의</button>
      </div>

      <button class="login-button" type="submit">로그인</button>
      <p class="error-message" id="errorMessage">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    </form>

    <section class="success-panel" id="successPanel">
      <div class="success-dot" aria-hidden="true"></div>
      <h2>You've Logged in!</h2>
    </section>
  </main>

  <script>
    const switchStage = document.getElementById("switchStage");
    const powerSwitch = document.getElementById("powerSwitch");
    const switchState = document.getElementById("switchState");
    const loginPanel = document.getElementById("loginPanel");
    const loginForm = document.getElementById("loginPanel");
    const userId = document.getElementById("userId");
    const password = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");
    const successPanel = document.getElementById("successPanel");

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function runStartupSequence() {
      // 저장 상태와 무관하게 항상 켜진 위치에서 시작해 꺼지는 연출을 보여준다.
      powerSwitch.classList.add("is-on");
      switchState.textContent = "ON";

      await wait(520);
      powerSwitch.classList.remove("is-on");
      powerSwitch.classList.add("is-off");
      switchState.textContent = "OFF";
      switchState.classList.add("visible");

      await wait(760);
      switchStage.classList.add("startup-gone");

      await wait(430);
      loginPanel.classList.add("visible");

      await wait(520);
      userId.focus();
    }

    async function runSuccessSequence() {
      loginPanel.classList.add("leaving");
      loginPanel.classList.remove("visible");
      errorMessage.classList.remove("visible");

      await wait(470);
      switchStage.classList.remove("move-up");
      switchStage.classList.remove("fade-away");
      switchStage.classList.remove("startup-gone");
      powerSwitch.classList.remove("is-off");
      switchState.classList.remove("visible");

      await wait(250);
      powerSwitch.classList.add("is-on");
      switchState.textContent = "ON";
      switchState.classList.add("visible");

      await wait(820);
      switchStage.classList.add("fade-away");

      await wait(250);
      successPanel.classList.add("visible");
    }

    function showError() {
      errorMessage.classList.add("visible");
      loginPanel.classList.remove("shake");
      void loginPanel.offsetWidth;
      loginPanel.classList.add("shake");
      password.select();
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const idValue = userId.value.trim();
      const passwordValue = password.value;

      if (idValue === "admin" && passwordValue === "Korea") {
        runSuccessSequence();
      } else {
        showError();
      }
    });

    document.querySelector(".support-link").addEventListener("click", () => {
      alert("고객센터 연결 기능은 데모 화면입니다.");
    });

    window.addEventListener("DOMContentLoaded", runStartupSequence);
  </script>
</body>
</html>
